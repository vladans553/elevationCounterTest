name: Selenium TestNG CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run TestNG Tests
      # OVDE DODAJEMO SAKRIVENU LOZINKU KROZ ENV
      env:
		VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
		VALID_USERNAME: ${{ secrets.VALID_USERNAME }}

      run: mvn clean test -DsuiteXmlFile=parallel-run.xml